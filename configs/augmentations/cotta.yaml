# CoTTA test-time augmentation preset
# Pipeline: Clip → ColorJitter (with gamma) → GaussianBlur → GaussianNoise

photo:
    - clip:
        min_val: 0.0
        max_val: 1.0

    - color_jitter:
        brightness: [0.6, 1.4]
        contrast: [0.7, 1.3]
        saturation: [0.5, 1.5]
        hue: [-0.06, 0.06]
        gamma: [0.7, 1.3]

    - gaussian_blur:
        kernel_size: 5
        sigma: [0.001, 0.5]

    - gaussian_noise:
        mean: 0
        std: 0.005
        clip: true

