# CoTTA augmentations + multi-scale geometric augmentations
# Usage: python run.py --augs_config configs/augmentations/cotta_with_geom.yaml --height 352 --width 704

photo:
  - clip:
      min_val: 0.0
      max_val: 1.0

  - color_jitter:
      brightness: [0.6, 1.4]
      contrast: [0.7, 1.3]
      saturation: [0.5, 1.5]
      hue: [-0.06, 0.06]
      gamma: [0.7, 1.3]

  - gaussian_blur:
      kernel_size: 5
      sigma: [0.001, 0.5]

  - gaussian_noise:
      mean: 0
      std: 0.005
      clip: true

geom:
  img_ratios: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
  flip: true

