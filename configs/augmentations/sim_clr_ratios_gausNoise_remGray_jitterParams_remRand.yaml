# SimCLR augmentation preset
# Pipeline: RandomApply(ColorJitter) → RandomGrayscale → RandomApply(GaussianBlur)
#           → RandomHorizontalFlip

photo:
    - color_jitter:
        brightness: [0.6, 1.4]
        contrast: [0.7, 1.3]
        saturation: [0.5, 1.5]
        hue: [-0.06, 0.06]
        gamma: [0.7, 1.3]

    - gaussian_blur:
        kernel_size: 13
        sigma: [0.1, 2.0]
    
    - gaussian_noise:
        mean: 0
        std: 0.005
        clip: true

    # - random_horizontal_flip: {}
geom:
    img_ratios: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
    flip: true # random flip handled in a consistency.py
